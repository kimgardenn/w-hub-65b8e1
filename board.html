<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<title>Locked</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --field: #f2f2f7;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --line: #e5e5ea;
    --accent: #0a84ff;
    --danger: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --field: #2c2c2e;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --line: #2c2c2e;
      --accent: #0a84ff;
    }
  }
  * { -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: -apple-system-body;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo",
                 "Pretendard", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  #lock {
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .glyph {
    width: 52px; height: 52px;
    margin: 0 auto 18px;
    border-radius: 15px;
    background: var(--card);
    border: 0.5px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .glyph svg { width: 24px; height: 24px; fill: none; stroke: var(--muted); stroke-width: 1.7; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.2px; margin: 0 0 6px; }
  .sub { font-size: 14px; color: var(--muted); margin: 0 0 22px; line-height: 1.4; }
  .card {
    background: var(--card);
    border-radius: 16px;
    border: 0.5px solid var(--line);
    padding: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  input[type=password], input[type=tel] {
    width: 100%;
    box-sizing: border-box;
    border: none;
    outline: none;
    background: var(--field);
    border-radius: 12px;
    color: var(--text);
    font-size: 24px;
    letter-spacing: 6px;
    text-align: center;
    padding: 13px 4px;
    font-family: inherit;
  }
  input::placeholder { color: var(--muted); letter-spacing: 0; font-size: 17px; }
  button {
    width: 100%;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    font-family: inherit;
    cursor: pointer;
    transition: opacity .15s ease, transform .1s ease;
  }
  button:active { transform: scale(.985); opacity: .88; }
  button:disabled { opacity: .45; }
  .row {
    display: flex; align-items: center; gap: 9px;
    margin: 14px 2px 0;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .row input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  .msg {
    margin-top: 14px;
    font-size: 13px;
    color: var(--danger);
    min-height: 17px;
    line-height: 1.35;
  }
  .spin {
    margin: 16px auto 0;
    width: 20px; height: 20px;
    border: 2px solid var(--line);
    border-top-color: var(--muted);
    border-radius: 50%;
    animation: sp .8s linear infinite;
    display: none;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  #lock.shake { animation: shake .38s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }
</style>
</head>

    <button id="go" type="button">열기</button>
  </div>
  <label class="row" for="remember">
    <input id="remember" type="checkbox" >

  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="spin" id="spin"></div>
</div>

<script>
(function () {
  "use strict";
  var SALT_LEN = 16, IV_LEN = 12, ITER = 100000, ID = "board";
  var STORE_PREFIX = "won.key.";
  var b64 = function (buf) {
    var s = "", b = new Uint8Array(buf), C = 0x8000;
    for (var i = 0; i < b.length; i += C) s += String.fromCharCode.apply(null, b.subarray(i, i + C));
    return btoa(s);
  };
  var unb64 = function (str) {
    var bin = atob(str), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  };
  var enc = new TextEncoder(), dec = new TextDecoder("utf-8");
  var raw = unb64(document.getElementById("payload").textContent.trim());
  var salt = raw.slice(0, SALT_LEN);
  var iv = raw.slice(SALT_LEN, SALT_LEN + IV_LEN);
  var ct = raw.slice(SALT_LEN + IV_LEN);

  var $pw = document.getElementById("pw"),
      $go = document.getElementById("go"),
      $msg = document.getElementById("msg"),
      $rm = document.getElementById("remember"),
      $spin = document.getElementById("spin"),
      $lock = document.getElementById("lock");

  function deriveKey(pass, keyUsages, extractable) {
    return crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, extractable, keyUsages);
      });
  }

  function open_(html) {
    // 원본 문서를 그대로 새 문서로 써 넣는다: CSS/JS/음성/로컬스토리지가 원래대로 동작.
    document.open();
    document.write(html);
    document.close();
  }

  function fail(text) {
    $msg.textContent = text;
    $lock.classList.add("shake");
    setTimeout(function () { $lock.classList.remove("shake"); }, 400);
    $pw.value = "";
    $pw.focus();
  }

  function tryPass(pass) {
    $msg.textContent = "";
    $go.disabled = true;
    $spin.style.display = "block";
    return deriveKey(pass, ["decrypt"], $rm.checked).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct).then(function (pt) {
        if ($rm.checked) {
          try {
            return crypto.subtle.exportKey("raw", key).then(function (k) {
              localStorage.setItem(STORE_PREFIX + ID, b64(k));
              open_(dec.decode(pt));
            });
          } catch (e) { /* export 실패해도 열기는 계속 */ }
        }
        open_(dec.decode(pt));
      });
    }).catch(function (e) {
      $go.disabled = false;
      $spin.style.display = "none";
      if (pass === undefined) return;      // 자동 열기 실패: 조용히 잠금 화면 유지
      fail("비밀번호가 맞지 않아요");
    });
  }

  function autoOpen() {
    var stored = null;
    try { stored = localStorage.getItem(STORE_PREFIX + ID); } catch (e) {}
    if (!stored) return false;
    $spin.style.display = "block";
    var keyBytes = unb64(stored);
    crypto.subtle.importKey("raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"])
      .then(function (key) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct); })
      .then(function (pt) { open_(dec.decode(pt)); })
      .catch(function () {
        try { localStorage.removeItem(STORE_PREFIX + ID); } catch (e) {}
        $spin.style.display = "none";
        $pw.focus();
      });
    return true;
  }

  // ?reset=1 : 이 기기에 기억된 키를 지우고 잠금 화면부터
  try {
    if (new URLSearchParams(location.search).get("reset") === "1") {
      Object.keys(localStorage).forEach(function (k) {
        if (k.indexOf(STORE_PREFIX) === 0) localStorage.removeItem(k);
      });
      history.replaceState(null, "", location.pathname);
    }
  } catch (e) {}

  $go.addEventListener("click", function () {
    var v = $pw.value;
    if (!v) { $msg.textContent = "비밀번호를 입력해 주세요"; $pw.focus(); return; }
    tryPass(v);
  });
  $pw.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); $go.click(); }
  });

  // document.open()은 문서가 아직 파싱 중이면 무시된다 → load 이후에 자동 열기 시도
  function boot() {
    if (!autoOpen()) { try { $pw.focus(); } catch (e) {} }
  }
  if (document.readyState === "complete") setTimeout(boot, 0);
  else window.addEventListener("load", boot, { once: true });
})();
</script>
